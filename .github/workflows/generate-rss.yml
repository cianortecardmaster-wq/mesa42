name: Atualizar arquivos gerados

on:
  push:
    branches:
      - main
    paths:
      - "js/obras-data.js"
      - "js/comments.js"
      - "scripts/generate-rss.mjs"
      - "scripts/generate-giscus-config.mjs"
      - "CNAME"
      - ".github/workflows/generate-rss.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-arquivos-main
  cancel-in-progress: true

jobs:
  gerar-arquivos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar feed RSS
        run: node scripts/generate-rss.mjs

      - name: Configurar comentários
        run: node scripts/generate-giscus-config.mjs

      - name: Publicar arquivos atualizados
        run: |
          if git diff --quiet -- feed.xml js/giscus-config.json; then
            echo "Os arquivos gerados já estão atualizados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml js/giscus-config.json
          git commit -m "Atualiza arquivos gerados do Mesa 42"
          git push
